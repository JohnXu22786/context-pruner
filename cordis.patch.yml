# dsh-context-triage 的 bundle 补丁：将插件行插入启动树。
# 挂载方式二选一：
#   1) dsh plugin --profile web add link:/绝对路径/context-pruner
#   2) 手动把本文件（或其中条目）合并进 profile 的 cordis.patch.yml，
#      或直接 dsh web --patch ./cordis.patch.yml 启动。
#
# name 必须与 package.json 的包名一致；config 可省略（由导出 Schema 填充默认值），
# 也可整行覆盖任意字段，例如：
#   config:
#     budget:
#       contextTokens: 200000
- insert:
    id: context-triage
    name: dsh-context-triage
